name: simple_game_1
description: "A new Flutter project."
publish_to: "none"
version: 1.2.3+4

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.16.0
  flame_forge2d: ^0.16.0+5
  flame_audio: ^2.1.2
  vector_math: any
  shared_preferences: ^2.5.3
  hive_flutter: ^1.1.0
  sensors_plus: ^6.1.1
  wakelock_plus: ^1.3.2
  flutter_facebook_auth: ^6.0.3
  url_launcher: ^6.3.1
  google_mobile_ads: ^6.0.0
  change_app_package_name: ^1.4.0

dependency_overrides:
  vector_math: 2.1.4

flutter:
  assets:
    - assets/images/player_car.png
    - assets/images/
    - assets/images/cars/
    - assets/images/roads/
    - assets/audio/
    - assets/audio/sounds/
  fonts:
    - family: Akira
      fonts:
        - asset: assets/fonts/akira.otf

    - family: Calistoga-Regular
      fonts:
        - asset: assets/fonts/Calistoga-Regular.ttf

  uses-material-design: true